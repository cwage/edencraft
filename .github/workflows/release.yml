name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Build mrpack
        env:
          # strip leading "v" so pack.toml gets a clean semver, e.g. v1.0.0 -> 1.0.0
          PACK_VERSION: ${{ github.ref_name }}
        run: |
          export PACK_VERSION="${PACK_VERSION#v}"
          ./setup.sh

      - name: Rename and checksum
        run: |
          out="edenpack-${GITHUB_REF_NAME}.mrpack"
          mv edenpack.mrpack "$out"
          sha256sum "$out" > "$out.sha256"
          echo "ASSET=$out" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$ASSET" "$ASSET.sha256"
